apiVersion: acid.zalan.do/v1
kind: postgresql
metadata:
  name: acid-e2e
  namespace: athens-demo
  annotations:
    athens.warewave.io/enabled: "true"
    athens.warewave.io/access: "dev-writers:rw,dev-readers:ro,e2e-writers:rw,e2e-readers:ro"
spec:
  teamId: acid
  numberOfInstances: 1
  volume: {size: 1Gi}
  users:
    foo_user: []
  databases:
    foo: foo_user
  postgresql: {version: "16"}
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
