apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-db
  namespace: athens-demo
  annotations:
    athens.warewave.io/enabled: "true"
    athens.warewave.io/access: "dev-writers:rw,dev-readers:ro,e2e-writers:rw,e2e-readers:ro"
    athens.warewave.io/environment: staging
spec:
  instances: 1
  storage: {size: 1Gi}
  bootstrap:
    initdb: {database: app, owner: app}
