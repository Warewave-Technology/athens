apiVersion: v1
kind: Namespace
metadata:
  name: athens-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mockidp, namespace: athens-system}
spec:
  selector: {matchLabels: {app: mockidp}}
  template:
    metadata: {labels: {app: mockidp}}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mockidp
          image: athens-mockidp:e2e
          imagePullPolicy: Never
          env:
            - {name: MOCKIDP_LISTEN, value: "0.0.0.0:8082"}
            - {name: MOCKIDP_PUBLIC_ADDR, value: "mockidp.athens-system.svc:8082"}
            - {name: MOCKIDP_CLIENT_ID, value: athens-e2e}
            - {name: MOCKIDP_CLIENT_SECRET, value: athens-e2e-client-secret}
            - {name: MOCKIDP_TENANT, value: 11111111-2222-3333-4444-555555555555}
            - {name: MOCKIDP_DEFAULT_USER, value: reader}
            - {name: MOCKIDP_USER_ADMIN, value: "admin@e2e.test|e2e-admins,e2e-writers"}
            - {name: MOCKIDP_USER_WRITER, value: "writer@e2e.test|e2e-writers"}
            - {name: MOCKIDP_USER_READER, value: "reader@e2e.test|e2e-readers"}
          ports: [{containerPort: 8082}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata: {name: mockidp, namespace: athens-system}
spec:
  selector: {app: mockidp}
  ports: [{port: 8082, targetPort: 8082}]
