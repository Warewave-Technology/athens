apiVersion: v1
kind: ServiceAccount
metadata: {name: athens-e2e, namespace: athens-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: athens-e2e, namespace: athens-demo}
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["create", "delete", "get"]
  - apiGroups: [""]
    resources: ["services", "secrets"]
    verbs: ["create", "delete", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: athens-e2e, namespace: athens-demo}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: athens-e2e}
subjects: [{kind: ServiceAccount, name: athens-e2e, namespace: athens-system}]
---
apiVersion: batch/v1
kind: Job
metadata: {name: athens-e2e, namespace: athens-system}
spec:
  backoffLimit: 0
  template:
    metadata: {labels: {app: athens-e2e}}
    spec:
      serviceAccountName: athens-e2e
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: e2e
          image: athens-e2e:e2e
          imagePullPolicy: Never
          env:
            - {name: ATHENS_URL, value: "http://athens.athens-system.svc:8080"}
            - {name: E2E_NAMESPACE, value: athens-demo}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
