{{- if not .Values.secret.existingSecret }}
{{- if or (not .Values.secret.clientSecret) (not .Values.secret.sessionKey) }}
{{- fail "set secret.existingSecret, or both secret.clientSecret and secret.sessionKey" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "athens.fullname" . }}
  labels: {{- include "athens.labels" . | nindent 4 }}
type: Opaque
stringData:
  clientSecret: {{ .Values.secret.clientSecret | quote }}
  sessionKey: {{ .Values.secret.sessionKey | quote }}
{{- end }}
