{{- /* One Role + RoleBinding per discovery namespace (ADR-005, ADR-006, ADR-016, ADR-017). */}}
{{- $d := .Values.config.discovery | default dict }}
{{- $cnpg := (dig "cnpg" "enabled" true $d) }}
{{- $zalando := (dig "zalando" "enabled" true $d) }}
{{- range $ns := ($d.namespaces | default list) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "athens.fullname" $ }}-discovery
  namespace: {{ $ns }}
  labels: {{- include "athens.labels" $ | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get"]
  {{- if $cnpg }}
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch"]
  {{- end }}
  {{- if $zalando }}
  - apiGroups: ["acid.zalan.do"]
    resources: ["postgresqls"]
    verbs: ["get", "list", "watch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "athens.fullname" $ }}-discovery
  namespace: {{ $ns }}
  labels: {{- include "athens.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "athens.fullname" $ }}-discovery
subjects:
  - kind: ServiceAccount
    name: {{ include "athens.fullname" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
