{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "athens.fullname" . }}
  labels: {{- include "athens.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "athens.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 14 }}
      ports: [{port: {{ .Values.service.port }}, protocol: TCP}]
    - from:
        - namespaceSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.metricsNamespaceSelector | nindent 14 }}
      ports: [{port: {{ .Values.service.metricsPort }}, protocol: TCP}]
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    # Kubernetes API (443/6443) and Entra ID (443)
    - ports: [{port: 443, protocol: TCP}, {port: 6443, protocol: TCP}]
    # Postgres targets: in the discovery namespaces, or in any namespace when
    # the whole cluster is watched
    {{- $d := .Values.config.discovery | default dict }}
    - to:
        - namespaceSelector:
          {{- if $d.namespaces }}
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: {{- toYaml $d.namespaces | nindent 18 }}
          {{- else }} {}
          {{- end }}
      ports:
        {{- range .Values.networkPolicy.postgresPorts }}
        - {port: {{ . }}, protocol: TCP}
        {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}{{ toYaml . | nindent 4 }}{{ end }}
{{- end }}
