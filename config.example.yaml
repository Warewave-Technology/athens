# athens configuration. Every scalar can be overridden via env:
# ATHENS_<PATH_IN_UPPER_SNAKE>, e.g. ATHENS_OIDC_CLIENTSECRET, ATHENS_AUTH_SESSIONKEY
#
# Which databases exist and who may use them is not configured here: it comes
# from annotations on the databases themselves (docs/DATABASES.md):
#   athens.warewave.io/enabled: "true"
#   athens.warewave.io/access: "<group>:rw,<group>:ro"
#   athens.warewave.io/readonly: "true"            (optional)

server:
  listen: ":8080"
  metricsListen: ":9090"
  baseURL: "https://athens.example.com"   # external URL, used for redirects and Origin checks
  trustedProxies: ["10.0.0.0/8"]           # CIDRs allowed to set X-Forwarded-For
  insecureDev: false                       # allow http baseURL, no HSTS (local dev only)

oidc:
  issuer: "https://login.microsoftonline.com/11111111-2222-3333-4444-555555555555/v2.0"   # your tenant ID
  clientID: "<APP_CLIENT_ID>"
  clientSecret: ""                         # from env ATHENS_OIDC_CLIENTSECRET
  redirectPath: "/auth/callback"
  scopes: ["openid", "profile", "email"]
  allowedGroups: []                        # optional: Entra group IDs allowed to sign in at all
  workloadIdentity:                        # not implemented yet
    enabled: false
    tokenFile: "/var/run/secrets/azure/tokens/azure-identity-token"

auth:
  sessionKey: ""                           # 32+ bytes base64, from env ATHENS_AUTH_SESSIONKEY
  sessionTTL: 8h
  idleTTL: 1h

authz:
  readOnly: false                          # emergency switch: everyone gets read only
  adminGroups: ["<GROUP_ID_PLATFORM_ADMINS>"]   # see the Administration pages (no data access by itself)
  groupAliases: {}                         # optional names for access annotations, e.g. {dba: "<GROUP_ID_DBA>"}

discovery:
  namespaces: []                           # optional: only watch these namespaces (default: the whole cluster)
  resync: 10m
  useFQDN: false
  clusterDomain: "cluster.local"
  defaultSSLMode: "prefer"
  annotationPrefix: "athens.warewave.io"
  # picks the postgres container of an annotated workload (else the first container)
  imagePattern: '(^|/)(postgres|postgresql|postgis/postgis|pgvector/pgvector|timescale/timescaledb[^/]*|bitnami/postgresql[^/]*)$'
  cnpg:
    enabled: true
    useSuperuser: false
    verifyTLS: false
  zalando:
    enabled: true
    useSuperuser: false
    secretTemplate: "{username}.{cluster}.credentials.postgresql.acid.zalan.do"

limits:
  statementTimeout: 30s
  lockTimeout: 5s
  maxRows: 1000
  gridMaxPageSize: 500
  maxCellBytes: 65536
  poolMaxConns: 4
  concurrentQueriesPerUser: 3
  historyPerUser: 500

audit:
  logSQL: true
  logValues: false
  logReads: true                           # grid page/cell reads and structure views
  retentionDays: 90

store:
  path: "/data/athens.db"

log:
  level: info                              # debug|info|warn|error
