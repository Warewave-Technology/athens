# dbview configuration. Every scalar can be overridden via env:
# DBVIEW_<PATH_IN_UPPER_SNAKE>, e.g. DBVIEW_OIDC_CLIENTSECRET, DBVIEW_AUTH_SESSIONKEY

server:
  listen: ":8080"
  metricsListen: ":9090"
  baseURL: "https://dbview.example.com"   # external URL, used for redirects and Origin checks
  trustedProxies: ["10.0.0.0/8"]           # CIDRs allowed to set X-Forwarded-For
  insecureDev: false                       # allow http baseURL, no HSTS (local dev only)

oidc:
  issuer: "https://login.microsoftonline.com/<TENANT_ID>/v2.0"
  clientID: "<APP_CLIENT_ID>"
  clientSecret: ""                         # from env DBVIEW_OIDC_CLIENTSECRET
  redirectPath: "/auth/callback"
  scopes: ["openid", "profile", "email"]
  allowedGroups: []                        # optional: Entra group object IDs allowed to log in at all
  workloadIdentity:                        # M8
    enabled: false
    tokenFile: "/var/run/secrets/azure/tokens/azure-identity-token"

auth:
  sessionKey: ""                           # 32+ bytes base64, from env DBVIEW_AUTH_SESSIONKEY
  sessionTTL: 8h
  idleTTL: 1h

authz:
  readOnly: false                          # global kill switch: everyone gets read
  adminGroups: ["<GROUP_ID_PLATFORM_ADMINS>"]
  rules:                                   # effective level = max of matching rules
    - name: dba-all
      groups: ["<GROUP_ID_DBA>"]
      namespaces: ["*"]
      targets: ["*"]                       # glob on target name
      databases: ["*"]
      level: write
    - name: payments-devs-read
      groups: ["<GROUP_ID_PAYMENTS_DEV>"]
      namespaces: ["payments", "payments-staging"]
      level: read
    - name: payments-devs-write-staging
      groups: ["<GROUP_ID_PAYMENTS_DEV>"]
      namespaces: ["payments-staging"]
      level: write

discovery:
  namespaces: ["payments", "payments-staging", "orders"]
  resync: 10m
  useFQDN: false
  clusterDomain: "cluster.local"
  defaultSSLMode: "prefer"
  annotationPrefix: "dbview.warewave.io"
  cnpg:
    enabled: true
    useSuperuser: false
    verifyTLS: false
  zalando:
    enabled: true
    useSuperuser: false
    secretTemplate: "{username}.{cluster}.credentials.postgresql.acid.zalan.do"
  generic:
    enabled: true
    imagePattern: '(^|/)(postgres|postgresql|postgis/postgis|pgvector/pgvector|timescale/timescaledb[^/]*|bitnami/postgresql[^/]*)$'

limits:
  statementTimeout: 30s
  lockTimeout: 5s
  maxRows: 1000
  gridMaxPageSize: 500
  maxCellBytes: 65536
  poolMaxConns: 4
  concurrentQueriesPerUser: 3
  historyPerUser: 500

audit:
  logSQL: true
  logValues: false
  retentionDays: 90

store:
  path: "/data/dbview.db"

log:
  level: info                              # debug|info|warn|error
