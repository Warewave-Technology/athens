name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: cd web && pnpm install --frozen-lockfile
      - uses: golangci/golangci-lint-action@v8
        with: { version: latest }
      - run: cd web && pnpm lint && pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: cd web && pnpm install --frozen-lockfile
      - run: make test

  integration:
    runs-on: ubuntu-latest # docker is available on the runner for testcontainers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make test-int

  image:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - run: make image IMAGE=athens:ci
      - name: image size
        run: docker image inspect athens:ci --format '{{.Size}}' | awk '{ printf "%.1f MB\n", $1/1048576; if ($1 > 40*1048576) exit 1 }'
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: athens:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
