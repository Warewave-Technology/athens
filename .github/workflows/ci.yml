name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release workflow runs the full suite before publishing

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: cd web && pnpm install --frozen-lockfile
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with: { version: v2.14.0 }
      - run: cd web && pnpm lint && pnpm typecheck
      - name: govulncheck (Go modules and standard library)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: pnpm audit
        run: cd web && pnpm audit
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: helm lint + kubeconform (cluster-wide and namespaced)
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          kc="$(go env GOPATH)/bin/kubeconform -strict -summary -ignore-missing-schemas"
          helm lint deploy/helm/athens -f deploy/helm/athens/ci-values.yaml
          helm template ci deploy/helm/athens -f deploy/helm/athens/ci-values.yaml | $kc
          helm template ci deploy/helm/athens -f deploy/helm/athens/ci-values.yaml --set 'config.discovery.namespaces={payments,orders}' | $kc

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: cd web && pnpm install --frozen-lockfile
      - run: make test

  integration:
    runs-on: ubuntu-latest # Docker is available on the runner for testcontainers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - run: make test-int

  image:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make image IMAGE=athens:ci
      - name: image size (max 40 MB)
        run: docker image inspect athens:ci --format '{{.Size}}' | awk '{ printf "%.1f MB\n", $1/1048576; if ($1 > 40*1048576) exit 1 }'
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: athens:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  e2e:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name != 'pull_request'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with: { install_only: true }
      - run: make e2e
