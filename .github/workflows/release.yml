name: release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/warewave-technology/athens
  CHART_REPO: oci://ghcr.io/warewave-technology/charts

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    runs-on: ubuntu-latest
    needs: [ci]
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signature
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=athens
            org.opencontainers.image.description=PostgreSQL web client for Kubernetes with Entra ID sign-in
            org.opencontainers.image.licenses=Apache-2.0
      - id: date
        run: echo "now=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: athens
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.date.outputs.now }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@v4.1.3
      - name: sign the image (keyless, GitHub OIDC)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

  chart:
    runs-on: ubuntu-latest
    needs: [image]
    permissions:
      contents: read
      packages: write
    outputs:
      package: ${{ steps.package.outputs.file }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - id: package
        name: package with the tag as chart and app version
        run: |
          v="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/athens --version "$v" --app-version "$v" -d dist
          echo "file=dist/athens-$v.tgz" >> "$GITHUB_OUTPUT"
      - name: push to ghcr
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "${{ steps.package.outputs.file }}" "$CHART_REPO"
      - uses: actions/upload-artifact@v7
        with: { name: chart, path: dist/*.tgz }

  github-release:
    runs-on: ubuntu-latest
    needs: [image, chart]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: chart, path: dist }
      - name: create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF
          ## Install

          \`\`\`bash
          helm install athens ${CHART_REPO}/athens --version ${v} -n athens --create-namespace -f values.yaml
          \`\`\`

          Image: \`${IMAGE}:${v}\` (\`${DIGEST}\`), linux/amd64 and linux/arm64, signed with cosign (keyless):

          \`\`\`bash
          cosign verify ${IMAGE}:${v} \\
            --certificate-identity-regexp 'https://github.com/Warewave-Technology/athens/.github/workflows/release.yml@refs/tags/.*' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`
          EOF
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tgz --title "athens ${v}" --notes-file notes.md --generate-notes $prerelease
