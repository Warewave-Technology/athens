name: release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/warewave-technology/athens
  CHART_REPO: oci://ghcr.io/warewave-technology/charts

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    runs-on: ubuntu-latest
    needs: [ci]
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signature
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=athens
            org.opencontainers.image.description=PostgreSQL web client for Kubernetes with Entra ID sign-in
            org.opencontainers.image.licenses=Apache-2.0
      - id: date
        run: echo "now=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: athens
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.date.outputs.now }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: sign the image (keyless, GitHub OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  chart:
    runs-on: ubuntu-latest
    needs: [image]
    permissions:
      contents: read
      packages: write
    outputs:
      package: ${{ steps.package.outputs.file }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - id: package
        name: package with the tag as chart and app version
        run: |
          v="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/athens --version "$v" --app-version "$v" -d dist
          echo "file=dist/athens-$v.tgz" >> "$GITHUB_OUTPUT"
      - name: push to ghcr
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          FILE: ${{ steps.package.outputs.file }}
        run: |
          echo "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          helm push "$FILE" "$CHART_REPO"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: chart, path: dist/*.tgz }

  github-release:
    runs-on: ubuntu-latest
    needs: [image, chart]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: chart, path: dist }
      - name: create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF
          ## Install

          \`\`\`bash
          helm install athens ${CHART_REPO}/athens --version ${v} -n athens --create-namespace -f values.yaml
          \`\`\`

          Image: \`${IMAGE}:${v}\` (\`${DIGEST}\`), linux/amd64 and linux/arm64, signed with cosign (keyless):

          \`\`\`bash
          cosign verify ${IMAGE}:${v} \\
            --certificate-identity-regexp 'https://github.com/Warewave-Technology/athens/.github/workflows/release.yml@refs/tags/.*' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`
          EOF
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tgz --title "athens ${v}" --notes-file notes.md --generate-notes $prerelease
