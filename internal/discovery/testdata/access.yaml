# readonly and access annotations (ADR-022)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: crm
  uid: uid-crm
  annotations:
    athens.warewave.io/enabled: "true"
    athens.warewave.io/readonly: "true"
    athens.warewave.io/access: "system-admins:rw, developers:ro,bad-entry developers:rw qa:admin"
spec:
  serviceName: crm
  selector: {matchLabels: {app: crm}}
  template:
    metadata: {labels: {app: crm}}
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: crm-env, key: password}}
---
apiVersion: v1
kind: Secret
metadata: {name: crm-env}
stringData: {password: crm-pw}
---
apiVersion: v1
kind: Service
metadata: {name: crm}
spec:
  selector: {app: crm}
  ports: [{port: 5432}]
---
# access present but empty: nobody, fail closed; readonly typo: read-only
apiVersion: apps/v1
kind: Deployment
metadata:
  name: locked
  uid: uid-locked
  annotations:
    athens.warewave.io/enabled: "true"
    athens.warewave.io/readonly: "yes"
    athens.warewave.io/access: ""
spec:
  selector: {matchLabels: {app: locked}}
  template:
    metadata: {labels: {app: locked}}
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: locked-env, key: password}}
---
apiVersion: v1
kind: Secret
metadata: {name: locked-env}
stringData: {password: locked-pw}
---
apiVersion: v1
kind: Service
metadata: {name: locked}
spec:
  selector: {app: locked}
  ports: [{port: 5432}]
