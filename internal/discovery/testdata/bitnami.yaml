apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: my-release-postgresql
  uid: uid-bitnami
  labels: {app.kubernetes.io/name: postgresql, app.kubernetes.io/instance: my-release, app.kubernetes.io/component: primary}
spec:
  serviceName: my-release-postgresql-hl
  selector:
    matchLabels: {app.kubernetes.io/name: postgresql, app.kubernetes.io/instance: my-release, app.kubernetes.io/component: primary}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgresql, app.kubernetes.io/instance: my-release, app.kubernetes.io/component: primary}
    spec:
      volumes:
        - name: postgresql-password
          secret: {secretName: my-release-postgresql}
      containers:
        - name: postgresql
          image: docker.io/bitnami/postgresql:16.4.0-debian-12-r0
          ports: [{name: tcp-postgresql, containerPort: 5432}]
          env:
            - {name: POSTGRES_USER, value: app}
            - {name: POSTGRES_POSTGRES_PASSWORD_FILE, value: /opt/bitnami/postgresql/secrets/postgres-password}
            - {name: POSTGRES_PASSWORD_FILE, value: /opt/bitnami/postgresql/secrets/password}
            - {name: POSTGRES_DATABASE, value: appdb}
          volumeMounts:
            - {name: postgresql-password, mountPath: /opt/bitnami/postgresql/secrets/}
---
apiVersion: v1
kind: Secret
metadata: {name: my-release-postgresql}
stringData: {postgres-password: bitnami-admin-pw, password: bitnami-app-pw}
---
apiVersion: v1
kind: Service
metadata: {name: my-release-postgresql-hl}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: postgresql, app.kubernetes.io/instance: my-release, app.kubernetes.io/component: primary}
  ports: [{name: tcp-postgresql, port: 5432, targetPort: tcp-postgresql}]
---
apiVersion: v1
kind: Service
metadata: {name: my-release-postgresql}
spec:
  selector: {app.kubernetes.io/name: postgresql, app.kubernetes.io/instance: my-release, app.kubernetes.io/component: primary}
  ports: [{name: tcp-postgresql, port: 5432, targetPort: tcp-postgresql}]
