apiVersion: apps/v1
kind: Deployment
metadata: {name: orders-db, uid: uid-orders}
spec:
  selector: {matchLabels: {app: orders-db}}
  template:
    metadata: {labels: {app: orders-db, tier: db}}
    spec:
      containers:
        - name: metrics
          image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
        - name: db
          image: docker.io/library/postgres:15-alpine
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: orders-db-creds, key: user}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: orders-db-creds, key: password}}
---
apiVersion: v1
kind: Secret
metadata: {name: orders-db-creds}
stringData: {user: orders, password: orders-secret-pw}
---
apiVersion: v1
kind: Service
metadata: {name: orders-db-ro}
spec:
  selector: {app: orders-db}
  ports: [{port: 5432, targetPort: postgres}]
---
apiVersion: v1
kind: Service
metadata: {name: orders-db}
spec:
  selector: {app: orders-db}
  ports: [{port: 5432, targetPort: postgres}]
---
apiVersion: v1
kind: Service
metadata: {name: unrelated}
spec:
  selector: {app: other}
  ports: [{port: 5432}]
