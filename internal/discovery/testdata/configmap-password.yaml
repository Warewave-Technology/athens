apiVersion: apps/v1
kind: Deployment
metadata: {name: cm-db, uid: uid-cm, annotations: {athens.warewave.io/enabled: "true"}}
spec:
  selector: {matchLabels: {app: cm-db}}
  template:
    metadata: {labels: {app: cm-db}}
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              valueFrom: {configMapKeyRef: {name: cm-db-config, key: user}}
          envFrom:
            - configMapRef: {name: cm-db-config}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: cm-db-config}
data: {user: cm, POSTGRES_PASSWORD: configmap-pw-should-not-be-used}
---
apiVersion: v1
kind: Service
metadata: {name: cm-db}
spec:
  selector: {app: cm-db}
  ports: [{port: 5432}]
