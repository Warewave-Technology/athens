apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: payments-db
  uid: uid-cnpg
  labels: {team: payments}
  annotations:
    athens.warewave.io/environment: production
    athens.warewave.io/display-name: Payments
    athens.warewave.io/readonly-secret: payments-db-readonly
spec:
  instances: 3
  bootstrap:
    initdb: {database: payments, owner: payments}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata: {name: reports, uid: uid-cnpg-2}
spec:
  instances: 1
  enableSuperuserAccess: true
  bootstrap:
    initdb:
      secret: {name: reports-owner}
---
apiVersion: v1
kind: Secret
metadata: {name: payments-db-app}
stringData: {username: payments, password: cnpg-app-pw}
---
apiVersion: v1
kind: Secret
metadata: {name: payments-db-readonly}
stringData: {username: reader, password: cnpg-ro-pw}
---
apiVersion: v1
kind: Secret
metadata: {name: reports-owner}
stringData: {username: app, password: reports-owner-pw}
---
apiVersion: v1
kind: Service
metadata: {name: payments-db-rw}
spec:
  selector: {cnpg.io/cluster: payments-db, role: primary}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
apiVersion: v1
kind: Service
metadata: {name: payments-db-ro}
spec:
  selector: {cnpg.io/cluster: payments-db, role: replica}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
# Hypothetical operator-owned workload: the generic source must skip it.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: payments-db-shadow
  labels: {cnpg.io/cluster: payments-db}
  ownerReferences:
    - {apiVersion: postgresql.cnpg.io/v1, kind: Cluster, name: payments-db, uid: uid-cnpg}
spec:
  selector: {matchLabels: {cnpg.io/cluster: payments-db, role: primary}}
  template:
    metadata: {labels: {cnpg.io/cluster: payments-db, role: primary}}
    spec:
      containers:
        - name: postgres
          image: ghcr.io/cloudnative-pg/postgresql:16
          env:
            - {name: POSTGRES_PASSWORD, value: never-used}
